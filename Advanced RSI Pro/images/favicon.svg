<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#080809" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D976" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7700" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Круглый фон для фавикона -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGradient)" stroke-width="6" opacity="0.6" />

  <!-- Уровни RSI (Упрощенные) -->
  <line x1="120" y1="160" x2="392" y2="160" stroke="url(#goldGradient)" stroke-width="8" stroke-dasharray="12,8" opacity="0.9" />
  <line x1="120" y1="352" x2="392" y2="352" stroke="url(#goldGradient)" stroke-width="8" stroke-dasharray="12,8" opacity="0.9" />

  <!-- Линия RSI -->
  <path d="M 130 320 L 180 200 L 230 380 L 280 150 L 330 340 L 380 220" 
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />

  <!-- Сигнальная точка -->
  <circle cx="380" cy="220" r="24" fill="url(#goldGradient)" filter="url(#glow)" />
  <circle cx="380" cy="220" r="8" fill="#FFFFFF" />
</svg>